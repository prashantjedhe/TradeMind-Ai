services:
  - type: web
    name: trademind-backend
    env: python
    region: singapore
    plan: standard
    buildCommand: "pip install -r backend/requirements.txt"
    preDeployCommand: "cd backend && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: trademind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: trademind-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: DEFAULT_VIRTUAL_BALANCE
        value: 1000000.0
      - key: NEWS_ENABLED
        value: "true"

  - type: redis
    name: trademind-redis
    region: singapore
    plan: starter
    ipAllowList: []

databases:
  - name: trademind-db
    region: singapore
    plan: standard
    postgresMajorVersion: 16
